name: Deploy

# Chaîne de livraison dev -> préprod -> prod, contrôlée par ServiceNow DevOps Change.
# Le job « deploy-prod » appelle l'action ServiceNow/servicenow-devops-change :
# un changement normal (modèle DevOps Simplified) est créé et le job attend son
# approbation, décidée par la politique de changement côté ServiceNow.
# Sans secrets ServiceNow, l'étape de changement est sautée (mode simulation).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      origin:
        description: "Origine de la livraison (dependabot | manual)"
        default: manual
      pr_number:
        description: "Numéro de la PR"
        default: ""
      update_type:
        description: "Type de mise à jour Dependabot"
        default: ""
      dependencies:
        description: "Dépendances mises à jour"
        default: ""
      advisories:
        description: "Avis de sécurité (GHSA/CVE)"
        default: ""
      changed_files:
        description: "Fichiers modifiés (un par ligne)"
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  ORIGIN: ${{ inputs.origin || 'manual' }}
  PR_NUMBER: ${{ inputs.pr_number }}
  UPDATE_TYPE: ${{ inputs.update_type }}
  DEPENDENCIES: ${{ inputs.dependencies }}
  ADVISORIES: ${{ inputs.advisories }}

jobs:
  build-scan:
    name: build-scan
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.gate.outputs.risk }}
      eligible: ${{ steps.gate.outputs.eligible }}
      reasons: ${{ steps.gate.outputs.reasons }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Analyse des vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy.json
          exit-code: "0"

      - name: Fichiers modifiés
        id: files
        env:
          INPUT_FILES: ${{ inputs.changed_files }}
        run: |
          {
            echo "list<<EOF"
            if [ -n "$INPUT_FILES" ]; then printf '%s\n' "$INPUT_FILES"; else git diff --name-only HEAD~1 HEAD || true; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Risk gate
        id: gate
        env:
          TRIVY_REPORT: trivy.json
          CHANGED_FILES: ${{ steps.files.outputs.list }}
          MAX_SEVERITY: MEDIUM
        run: node scripts/risk-gate.js

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ github.run_id }}
          path: trivy.json

  deploy-dev:
    name: deploy-dev
    needs: build-scan
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      - name: Déploiement simulé + sonde de santé
        env: { APP_ENV: dev }
        run: bash scripts/simulate-deploy.sh

  deploy-preprod:
    name: deploy-preprod
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --omit=dev
      - name: Déploiement simulé + sonde de santé
        env: { APP_ENV: preprod }
        run: bash scripts/simulate-deploy.sh

  deploy-prod:
    # Le nom affiché doit être identique à « job-name » de l'action ServiceNow.
    name: deploy-prod
    needs: [build-scan, deploy-preprod]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      # Authentification : basic auth (utilisateur d'intégration sn_devops.integration)
      # en priorité, sinon jeton d'intégration de l'outil GitHub.
      - name: Configuration ServiceNow présente ?
        id: cfg
        env:
          USER: ${{ secrets.SN_DEVOPS_USER }}
          PASS: ${{ secrets.SN_DEVOPS_PASSWORD }}
          TOKEN: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          URL: ${{ secrets.SN_INSTANCE_URL }}
          TOOL: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOOL" ]; then
            echo "auth=none" >> "$GITHUB_OUTPUT"
          elif [ -n "$USER" ] && [ -n "$PASS" ]; then
            echo "auth=basic" >> "$GITHUB_OUTPUT"
          elif [ -n "$TOKEN" ]; then
            echo "auth=token" >> "$GITHUB_OUTPUT"
          else
            echo "auth=none" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(tail -n1 "$GITHUB_OUTPUT")" = "auth=none" ]; then
            echo "::warning::Secrets ServiceNow absents : changement non créé (mode simulation)."
          fi

      - name: Contenu du changement
        id: payload
        env:
          RISK: ${{ needs.build-scan.outputs.risk }}
          ELIGIBLE: ${{ needs.build-scan.outputs.eligible }}
          RISK_REASONS: ${{ needs.build-scan.outputs.reasons }}
          SN_CHG_MODEL_ID: ${{ vars.SN_CHG_MODEL_ID }}
          SN_ASSIGNMENT_GROUP: ${{ vars.SN_ASSIGNMENT_GROUP }}
          SN_CMDB_CI: ${{ vars.SN_CMDB_CI }}
        run: node scripts/change-payload.js

      - name: Changement ServiceNow (normal, DevOps Simplified) - basic auth
        id: change_basic
        if: steps.cfg.outputs.auth == 'basic'
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
          devops-integration-user-name: ${{ secrets.SN_DEVOPS_USER }}
          devops-integration-user-password: ${{ secrets.SN_DEVOPS_PASSWORD }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: deploy-prod
          change-request: ${{ steps.payload.outputs.json }}
          interval: "30"
          timeout: "3600"
          changeCreationTimeOut: "600"
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Changement ServiceNow (normal, DevOps Simplified) - jeton
        id: change_token
        if: steps.cfg.outputs.auth == 'token'
        uses: ServiceNow/servicenow-devops-change@v6.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: deploy-prod
          change-request: ${{ steps.payload.outputs.json }}
          interval: "30"
          timeout: "3600"
          changeCreationTimeOut: "600"
          abortOnChangeCreationFailure: true
          abortOnChangeStepTimeout: true

      - name: Changement créé
        if: steps.cfg.outputs.auth != 'none'
        env:
          NUMBER: ${{ steps.change_basic.outputs.change-request-number || steps.change_token.outputs.change-request-number }}
        run: |
          echo "- Changement ServiceNow : **$NUMBER**" >> "$GITHUB_STEP_SUMMARY"

      - run: npm ci --omit=dev
      - name: Déploiement simulé + sonde de santé
        env: { APP_ENV: prod }
        run: bash scripts/simulate-deploy.sh
